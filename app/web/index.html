<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoopAgent</title>
  <style>
    :root { --bg:#0f1115; --panel:#1a1d24; --accent:#4f8cff; --text:#e6e8eb; --muted:#8b929e; --border:#2a2e37; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 18px; background:var(--panel); font-weight:600; border-bottom:1px solid var(--border); }
    header small { color:var(--muted); font-weight:400; margin-left:8px; }
    #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
    .msg { max-width:760px; padding:12px 14px; border-radius:10px; white-space:pre-wrap; line-height:1.45; }
    .user { align-self:flex-end; background:var(--accent); color:#fff; }
    .bot { align-self:flex-start; background:var(--panel); }
    .sources { font-size:12px; color:var(--muted); margin-top:8px; }
    form { display:flex; gap:10px; padding:14px 18px; background:var(--panel); border-top:1px solid var(--border); }
    input { flex:1; padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; }
    button { padding:12px 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
  </style>
</head>
<body>
  <header>🏢 CoopAgent <small id="meta">connecting…</small></header>
  <div id="log"></div>
  <form id="form">
    <input id="q" placeholder="Ask about the bylaws, house rules, minutes…" autocomplete="off" />
    <button id="send" type="submit">Ask</button>
  </form>
  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('q');
    const send = document.getElementById('send');

    fetch('/health').then(r => r.json()).then(h => {
      document.getElementById('meta').textContent = `${h.llm_provider} · ${h.llm_model}`;
    }).catch(() => { document.getElementById('meta').textContent = 'offline'; });

    function bubble(cls) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      input.value = '';
      send.disabled = true;

      bubble('user').textContent = question;
      const bot = bubble('bot');
      let sourcesEl = null;

      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split('\n\n');
          buf = parts.pop();
          for (const part of parts) {
            const line = part.replace(/^data: /, '').trim();
            if (!line) continue;
            const msg = JSON.parse(line);
            if (msg.type === 'token') {
              bot.textContent += msg.text;
            } else if (msg.type === 'sources' && msg.sources.length) {
              sourcesEl = document.createElement('div');
              sourcesEl.className = 'sources';
              sourcesEl.textContent = 'Sources: ' + msg.sources.join(', ');
            } else if (msg.type === 'error') {
              bot.textContent += (bot.textContent ? '\n\n' : '') + '⚠️ ' + msg.message;
            }
            log.scrollTop = log.scrollHeight;
          }
        }
        if (sourcesEl) bot.appendChild(sourcesEl);
      } catch (err) {
        bot.textContent = '⚠️ Error: ' + err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
